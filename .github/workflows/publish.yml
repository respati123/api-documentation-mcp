name: Publish npm package

# Publishes api-documentation-mcp to npm when a tag like v0.2.0 is pushed, or manually.
# The tag must match the version in package.json. Auth is npm trusted publishing (OIDC), so no npm token is stored.
# The trusted publisher for this package must point at this file (repository respati123/api-documentation-mcp, workflow publish.yml).
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Lets npm request an OIDC token for trusted publishing, and attach a provenance statement.
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      # Trusted publishing needs npm 11.5.1 or later. The npm bundled with Node 22 is older.
      - name: Upgrade npm
        run: npm install -g npm@^11.5.1 && npm -v

      - run: npm ci

      - name: Check tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "Tag $TAG_VERSION does not match package.json version $PKG_VERSION"
            exit 1
          fi

      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      - name: Publish
        run: npm publish --provenance --access public
