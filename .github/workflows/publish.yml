name: Publish npm package

# Publishes api-documentation-mcp to npm.
# - Push to main: publishes only when the version in package.json is not on npm yet. Otherwise it does nothing.
# - Push a tag vX.Y.Z: publishes that version. The tag must match package.json, and the version must be new.
# - Manually: same as a push to main.
# Auth uses the NPM_TOKEN secret.
on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-npm
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - run: npm ci

      - name: Check tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "Tag $TAG_VERSION does not match package.json version $PKG_VERSION"
            exit 1
          fi

      - name: Check whether this version is already on npm
        id: exists
        run: |
          VERSION=$(node -p "require('./package.json').version")
          NAME=$(node -p "require('./package.json').name")
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "$NAME@$VERSION is already on npm."
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Refuse a tag for a version that is already published
        if: startsWith(github.ref, 'refs/tags/v') && steps.exists.outputs.published == 'true'
        run: |
          echo "The tag names a version that is already on npm. Bump the version in package.json first."
          exit 1

      - run: npm run typecheck
        if: steps.exists.outputs.published == 'false'
      - run: npm test
        if: steps.exists.outputs.published == 'false'
      - run: npm run build
        if: steps.exists.outputs.published == 'false'

      - name: Publish
        if: steps.exists.outputs.published == 'false'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public
